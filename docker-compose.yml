version: '3.9'
services:
  backend:
    image: taki-backend:latest
    build:
      context: backend
    depends_on:
      taki-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-toor}
      POSTGRES_DB: ${DB_NAME:-defaultdb}
      # Nom de service unique : évite la collision de l'alias "database" sur le réseau coolify partagé
      DB_URL: jdbc:postgresql://taki-db:5432/defaultdb
    networks:
      - db
      - coolify
    volumes:
      - backend-assets:/allo_cine/assets
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.taki-backend.rule=(Host(`takicine.bantou.me`) || Host(`takipatrick.bantou.me`) || Host(`takipipou.bantou.me`)) && PathPrefix(`/movies`)
      - traefik.http.routers.taki-backend.entrypoints=https
      - traefik.http.routers.taki-backend.tls.certresolver=letsencrypt
      - traefik.http.services.taki-backend.loadbalancer.server.port=8080

  frontend:
    image: taki-frontend:latest
    build:
      context: ./frontend
    networks:
      - db
      - coolify
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.taki-frontend.rule=Host(`takicine.bantou.me`) || Host(`takipatrick.bantou.me`) || Host(`takipipou.bantou.me`)
      - traefik.http.routers.taki-frontend.entrypoints=https
      - traefik.http.routers.taki-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.taki-frontend.loadbalancer.server.port=80

  taki-db:
    container_name: taki_database
    image: postgres:15.2-alpine
    restart: always
    networks:
      - db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-toor}
      POSTGRES_DB: ${DB_NAME:-defaultdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME:-root} -d ${DB_NAME:-defaultdb}'"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  db:
  coolify:
    external: true

volumes:
  db-data:
  backend-assets:
