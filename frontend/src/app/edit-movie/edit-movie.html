<div class="form-all d-flex w-100">
    <div class="form-movie flex-column w-50">
        <label for="title">Titre</label>
        <input type="text" id="title" name="title" [(ngModel)]="editedMovie.title" />
        <label for="releaseDate">Date de réalisation</label>
        <input type="date" id="releaseDate" name="releaseDate" [(ngModel)]="editedMovie.releaseDate" />
        <label for="director">Directeur</label>
        <input type="text" id="director" name="director" [(ngModel)]="editedMovie.director" />
        <label for="synopsis">Synopsis</label>
        <input type="text" id="synopsis" name="synopsis" [(ngModel)]="editedMovie.synopsis" />
        <label for="image">Changer l'affiche</label>
        <input type="file" id="image" name="image" accept="image/*" (change)="onFileSelected($event)" class="form-control" />
        @if (editedMovie.image) {
            <div class="poster-preview mt-2">
                <img [src]="'/movies/' + editedMovie.id + '/image'" alt="Affiche actuelle" />
            </div>
        }
        <button class="btn btn-warning mt-2" (click)="editMovie(editedMovie.id)">Mettre à jour</button>
    </div>
</div>
