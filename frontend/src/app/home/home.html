<div class="card">

    <p-carousel [value]="movies" [numVisible]="3" [numScroll]="1" [circular]="true"
        [responsiveOptions]="responsiveOptions" autoplayInterval="3000">
        <ng-template let-movie #item>
            <app-movie-card [movie]=movie></app-movie-card>
        </ng-template>
    </p-carousel>
</div>
