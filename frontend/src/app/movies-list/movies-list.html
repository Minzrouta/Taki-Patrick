<h1>Films</h1>

<table>
    <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Titre</th>
            <th scope="col">Date</th>
            <th scope="col">Réalisateur</th>
            <th scope="col">Note</th>
            <th scope="col">Synopsis</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        @for (movie of movies; track movie.id) {
        <tr>
            <th scope="row">{{movie.id}}</th>
            <td>{{movie.title}}</td>
            <td>{{movie.releaseDate | date:'dd/MM/yyyy'}}</td>
            <td>{{movie.director}}</td>
            <td>{{movie.rate}}</td>
            <td>{{movie.synopsis}}</td>
            @if(movie.id) {
            <td>
                <button type="button" class="btn btn-warning editButton" [routerLink]="['/edit-movie', movie.id]"><i
                        class="bi bi-pencil"></i></button>
                <button type="button" class="btn btn-danger deleteButton" (click)="deleteMovie(movie.id)"><i
                        class="bi bi-trash"></i></button>
            </td>
            }
        </tr>
        }
    </tbody>
</table>
<div class="div-button">
    <button class="btn btn-warning" routerLink="/add-movie">Nouveau film</button>
</div>
<router-outlet></router-outlet>
