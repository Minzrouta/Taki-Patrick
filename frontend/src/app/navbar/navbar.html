<nav class="navbar-pipou">
    <a class="navbar-brand">{{ title | titlecase }}</a>
    <a class="nav-item nav-link" routerLink="/">Accueil</a>
    <a class="nav-item nav-link ms-3" routerLink="/admin">Panel Admin</a>

    <div class="ms-auto d-flex align-items-center gap-2">
        @if (auth.currentUser$ | async; as user) {
        <span class="navbar-text">{{ user.firstName }} {{ user.lastName }}</span>
        <button class="btn btn-outline-secondary btn-sm" (click)="auth.signOut()">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
        } @else {
        <button class="btn btn-outline-primary btn-sm" (click)="auth.signInWithGoogle()">
            <i class="bi bi-google me-1"></i>Connexion / Créer un compte
        </button>
        }
    </div>
</nav>
